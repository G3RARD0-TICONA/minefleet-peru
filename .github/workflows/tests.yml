name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py check
      - run: coverage run manage.py test
      - run: coverage report --fail-under=70
      - run: pip-audit -r requirements.txt
      - name: Verificación de despliegue
        env:
          MINEFLEET_ENV: production
          MINEFLEET_SECRET_KEY: ci-only-7E4k9xB2mN8qR5tY1uI6oP3aS0dF4gH7jK9lZ2xC5vB8nM1q
          MINEFLEET_ALLOWED_HOSTS: example.com
          MINEFLEET_CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check --deploy
